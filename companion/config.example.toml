# Optional. With no config.toml at all, DOINK finds your WoW install by
# itself and uses the webhook set in game (/doink webhook <url>). Copy the
# lines you need into config.toml next to doink.exe (Windows tray menu:
# Edit settings) or next to doink (Linux). Changes apply while DOINK runs.

# The WoW install folder (the one holding _forever_), if DOINK doesn't find
# it. Single quotes = TOML literal string, no escaping.
# Windows:
# wow_dir = 'D:\Games\World of Warcraft'
# Linux (Lutris; Lutris, Steam/Proton and Wine prefixes are searched anyway):
# wow_dir = '/home/you/Games/battlenet/drive_c/Program Files (x86)/World of Warcraft'

# Or one exact file; overrides wow_dir.
# savedvariables_path = 'D:\Games\World of Warcraft\_forever_\WTF\Account\12345678#1\SavedVariables\DOINK.lua'

# Webhook for characters without one set in game. Keep it secret.
# webhook_url = "https://discord.com/api/webhooks/..."

# Print embeds to the console or log instead of posting (same as --dry-run).
# dry_run = false

# Seconds between checks of the SavedVariables file.
# poll_interval = 2.0

# When a character is seen for the first time, post at most this many of its
# queued events (the queue holds up to 500). 0 = post nothing old.
# max_backlog = 10

# Realtime: read the screenshots the addon takes for instant posts (in game:
# /doink realtime on). Only screenshots containing a DOINK code are read
# and deleted; your own are never touched. false = only post what the
# SavedVariables file shows after /reload or logout.
# realtime = true

# Loot embeds fetch the item's icon and tooltip from Wowhead (one small
# request per item per session; only the item id is sent). false = plain
# embeds with no network traffic beyond Discord.
# wowhead = true

# Once a day, ask GitHub for the latest release version. If it is newer the
# tray icon gets an orange dot and the menu offers to open the download
# page. Nothing is ever downloaded by DOINK itself. false = never check
# (the tray menu's "Check for updates" still works).
# update_check = true

# Also show a Windows notification when a newer version is found.
# update_notify = false

# Notifier on/off switches and filters live in the game:
#   /doink enable|disable <type>, /doink options, /doink set <type> <option> <value>
