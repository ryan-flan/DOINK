# Optional. The settings window (left-click the tray icon) writes config.toml
# for you; this file documents every option. To edit config.toml by hand,
# quit DOINK first. With no config.toml at all, DOINK finds your WoW install
# by itself and uses the webhook set in game (/doink webhook <url>).

# The WoW install folder, if it isn't in a standard location. Set by
# "Choose WoW folder…". Single quotes = TOML literal string, no escaping.
# wow_dir = 'D:\Games\World of Warcraft'

# Or one exact file; overrides wow_dir.
# savedvariables_path = 'D:\Games\World of Warcraft\_classic_beta_\WTF\Account\12345678#1\SavedVariables\DOINK.lua'

# Webhook for characters without one set in game. Set by the settings
# window. Keep it secret.
# webhook_url = "https://discord.com/api/webhooks/..."

# Print embeds to the console instead of posting (same as --dry-run).
# dry_run = false

# Seconds between checks of the SavedVariables file.
# poll_interval = 2.0

# When a character is seen for the first time, post at most this many of its
# queued events (the queue holds up to 500). 0 = post nothing old.
# max_backlog = 10

# Experimental: read the addon's strip off the WoW window and post while you
# play. Set by the settings window's "Realtime posting" checkbox; also needs
# /doink realtime on in game. See README, "How realtime works".
# realtime = false

# Loot embeds fetch the item's icon and tooltip from Wowhead (one small
# request per item per session; only the item id is sent). false = plain
# embeds with no network traffic beyond Discord.
# wowhead = true

# Notifier on/off switches and filters live in the game now:
#   /doink enable|disable <type>, /doink options, /doink set <type> <option> <value>
