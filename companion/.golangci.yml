version: "2"
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint # %w, errors.Is/As
    - misspell
    - unconvert
    - predeclared
  settings:
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
  exclusions:
    rules:
      - path: _test\.go$
        linters: [errcheck] # fixtures: a failed write shows up as a failed assertion
      - path: _windows\.go$
        linters: [errcheck] # Win32 proc.Call results are deliberately dropped
formatters:
  enable: [gofmt]
