name: Release

# Push a tag like v0.4.0 to publish a GitHub release with DOINK-<tag>.zip and
# its SHA-256. Run manually (Actions tab) to build the zip as an artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The addon alone, via the BigWigs packager (needs >= v2.6.0 for Forever:
  # it maps Interface 16xxx to the "forever" game type). On tags it uploads
  # to each store whose project id variable and API secret are set, and
  # skips the others silently. Manual runs never upload.
  #   CurseForge:   variable CURSEFORGE_PROJECT_ID, secret CF_API_KEY
  #   Wago Addons:  variable WAGO_PROJECT_ID,       secret WAGO_API_TOKEN
  #   WoWInterface: variable WOWI_PROJECT_ID,       secret WOWI_API_TOKEN
  # A project id stored as a secret instead of a variable works too (ids
  # aren't secret, but it's an easy mix-up in the GitHub UI).
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the packager writes the changelog from git history
      - uses: BigWigsMods/packager@v2
        with:
          args: >-
            ${{ github.ref_type != 'tag' && '-d' || '' }}
            ${{ (vars.CURSEFORGE_PROJECT_ID || secrets.CURSEFORGE_PROJECT_ID) && format('-p {0}', vars.CURSEFORGE_PROJECT_ID || secrets.CURSEFORGE_PROJECT_ID) || '' }}
            ${{ (vars.WAGO_PROJECT_ID || secrets.WAGO_PROJECT_ID) && format('-a {0}', vars.WAGO_PROJECT_ID || secrets.WAGO_PROJECT_ID) || '' }}
            ${{ (vars.WOWI_PROJECT_ID || secrets.WOWI_PROJECT_ID) && format('-w {0}', vars.WOWI_PROJECT_ID || secrets.WOWI_PROJECT_ID) || '' }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: addon-package
          path: .release/*.zip
          include-hidden-files: true # .release is a dot-directory
          if-no-files-found: error

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: companion/go.mod }

      - name: Companion tests (on Windows)
        working-directory: companion
        run: go test ./...

      # One self-contained exe: icon and version info come from winres.json
      # (go-winres writes a .syso that go build links in).
      - name: Build doink.exe
        working-directory: companion
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0" }
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --out cmd/doink/rsrc --product-version $tag --file-version $tag
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$tag" -o dist/Companion/doink.exe ./cmd/doink

      - name: Smoke test the built exe
        shell: pwsh
        run: |
          $dir = "smoke"
          Copy-Item -Recurse companion/dist/Companion $dir
          $sv = (Resolve-Path $dir).Path + "\DOINK.lua"
          Set-Content $sv @'
          DOINKDB = {
          ["chars"] = {
          ["Flano Wren-R"] = {
          ["events"] = {
          "{\"char\":\"Flano\",\"surname\":\"Wren\",\"realm\":\"R\",\"seq\":1,\"type\":\"level_up\",\"data\":{\"level\":2}}",
          },
          },
          },
          }
          '@
          Set-Content "$dir/config.toml" "savedvariables_path = '$sv'`ndry_run = true"
          $p = Start-Process "$dir/doink.exe" -ArgumentList "--once" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "doink.exe --once exited with $($p.ExitCode)" }

      # Same names and layout as the Python builds: the v0.11 self-updater
      # on existing installs looks for DOINK-<tag>.zip, its .sha256 and the
      # Companion/ folder inside.
      - name: Package
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq "tag") { "DOINK-$env:GITHUB_REF_NAME" } else { "DOINK-dev" }
          $out = "package/$name"
          New-Item -ItemType Directory -Force "$out/AddOns", "$out/Companion" | Out-Null
          Copy-Item -Recurse addon/DOINK "$out/AddOns/DOINK"
          Copy-Item -Recurse companion/dist/Companion/* "$out/Companion/"
          Copy-Item companion/config.example.toml "$out/Companion/"
          Copy-Item README.md, LICENSE "$out/"
          Compress-Archive -Path $out -DestinationPath "package/$name.zip"
          $hash = (Get-FileHash "package/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content -NoNewline "package/$name.zip.sha256"
          "ZIP=package/$name.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: doink-package
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: companion/go.mod }

      - name: Build doink
        working-directory: companion
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="${GITHUB_REF_NAME#v}"; else tag=0.0.0; fi
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$tag" -o dist/doink ./cmd/doink

      - name: Smoke test the built binary
        working-directory: companion
        run: |
          mkdir smoke
          cat > smoke/DOINK.lua <<'LUA'
          DOINKDB = {
          ["chars"] = {
          ["Flano Wren-R"] = {
          ["events"] = {
          "{\"char\":\"Flano\",\"surname\":\"Wren\",\"realm\":\"R\",\"seq\":1,\"type\":\"level_up\",\"data\":{\"level\":2}}",
          },
          },
          },
          }
          LUA
          printf "savedvariables_path = '%s'\ndry_run = true\n" "$PWD/smoke/DOINK.lua" > smoke/config.toml
          ./dist/doink --once --config smoke/config.toml

      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then name="DOINK-$GITHUB_REF_NAME-linux-amd64"; else name="DOINK-dev-linux-amd64"; fi
          mkdir package
          cp companion/dist/doink companion/config.example.toml README.md LICENSE package/
          tar -czf "$name.tar.gz" -C package doink config.example.toml README.md LICENSE
          printf '%s  %s' "$(sha256sum "$name.tar.gz" | cut -d' ' -f1)" "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "TARBALL=$name.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: doink-linux
          path: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256

  release:
    if: github.ref_type == 'tag'
    needs: [build, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: doink-* # not the store-only addon zip
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" \
            --title "DOINK ${{ github.ref_name }}" --generate-notes
