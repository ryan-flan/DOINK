version: 2
updates:
  - package-ecosystem: gomod
    directory: /companion
    schedule:
      interval: weekly
      day: monday
    groups:
      go-deps:
        patterns: ["*"]
    commit-message:
      prefix: "build(companion)"
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels: [dependencies]
